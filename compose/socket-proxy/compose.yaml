services:
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.2
    container_name: shreyws-socket-proxy
    restart: unless-stopped
    read_only: true
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_UNPAUSE: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      CONTAINERS: "1"
      DISTRIBUTION: "0"
      EVENTS: "1"
      EXEC: "0"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      NODES: "0"
      PLUGINS: "0"
      POST: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VERSION: "1"
      VOLUMES: "0"
      LOG_LEVEL: info
      TZ: Europe/Zurich
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_socket_proxy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - http://127.0.0.1:2375/_ping
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - diun.enable=true

networks:
  docker_socket_proxy:
    external: true
